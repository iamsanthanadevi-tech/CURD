
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f4f8;
            text-align: center;
        }

        .container {
            width: 70%;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
        }

        h2 {
            border: 2px solid #333;
            padding: 12px;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
        }

        th {
            background: #dce6f1;
        }

        a {
            color: #174ea6;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>STUDENT MANAGEMENT SYSTEM</h2>

    <a href="/add/">ADD STUDENT</a>

    <h3>Student Records</h3>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>
                <a href="/edit/{{ student.id }}/">Edit</a>
                <a href="/delete/{{ student.id }}/">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
